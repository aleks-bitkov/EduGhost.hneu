[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "EduGhost.hneu"
version = "0.1.0"
description = "EduGhost application for HNEU"
authors = [
    {name = "aleks", email = "aleks.bitkov9@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flet"
]


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.scripts]
edughost = "app.main:main"

[tool.ruff]
exclude = [
  ".git", ".venv", "__pypackages__", "build", "dist",
  "node_modules", ".ruff_cache", ".pytest_cache", ".mypy_cache",
]
line-length = 120
indent-width = 4
target-version = "py312"


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = ["B", "UP", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.flet.app]
path = "app"